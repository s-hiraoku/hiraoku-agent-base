name: Garden Verify

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      flow:
        description: "Flow name to run"
        required: true
        default: "verify_only"
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  garden:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request != null &&
       startsWith(github.event.comment.body, '/garden resume') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    uses: s-hiraoku/hiraoku-software-garden/.github/workflows/garden-reusable.yml@main
    with:
      flow: ${{ inputs.flow || (github.event_name == 'pull_request' && 'auto' || 'verify_only') }}
      issue_number: ${{ github.event.pull_request.number || github.event.issue.number || 0 }}
      node_version_file: .node-version
