name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Check npm version
        run: test "$(npm --version)" = 11.20.0
      - run: npm ci
      - run: npm ci --prefix packages/relay-nats --ignore-scripts
      - run: npm run check --prefix packages/relay-nats
      - run: mkdir -m 700 -p .runtime
      - name: Cache the pinned official NATS archive
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .runtime/nats-server-*.tar.gz
          key: nats-archive-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/relay-nats/scripts/install-server.mjs') }}
      - name: Check bounded NATS download retries
        run: |
          node node_modules/eslint/bin/eslint.js scripts/install-ci-nats.ts test/ci-nats/install.test.ts
          node --test test/ci-nats/install.test.ts
      - run: node scripts/install-ci-nats.ts > .runtime/nats-install.json
      - run: node docs/diagrams/render-mermaid.mjs --check
      - run: npm run lint
      - run: npm run typecheck
      - run: node node_modules/eslint/bin/eslint.js scripts/ci-nats.mjs scripts/lib/p7-worker.mjs packages/relay-nats/src packages/relay-nats/test packages/relay-nats/scripts
      - name: Check CI input refusals
        run: node --test --test-timeout=30000 test/ci-nats/arguments.test.js
      - name: Check TypeScript tools and legacy CLI entry points
        run: npm run test:tools
      - name: Run the JetStream package checks against the pinned broker
        run: |
          binary="$(node -p "JSON.parse(require('fs').readFileSync('.runtime/nats-install.json','utf8')).binary")"
          node scripts/ci-nats.mjs --stage p6 --nats-server "$binary"
      - name: Run the full regression suite
        env:
          NODE_OPTIONS: --disable-warning=ExperimentalWarning
        run: |
          export HAB_NATS_SERVER="$(node -p "JSON.parse(require('fs').readFileSync('.runtime/nats-install.json','utf8')).binary")"
          node --test --test-timeout=120000 test/*.test.js
