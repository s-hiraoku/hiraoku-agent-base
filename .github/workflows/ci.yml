name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Check toolchain pins
        run: npm run check:toolchain
      - run: npm ci
      - run: node docs/diagrams/render-mermaid.mjs --check
      - run: npm run lint
      - run: npm run typecheck
      - name: Check TypeScript tools and legacy CLI entry points
        run: npm run test:tools
      - name: Run the full regression suite
        env:
          NODE_OPTIONS: --disable-warning=ExperimentalWarning
        run: |
          node --test --test-timeout=120000 test/*.test.js
