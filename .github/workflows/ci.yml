name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned npm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - name: Check toolchain pins
        run: npm run check:toolchain
      - run: npm ci
      - name: Check generated Hermes runtime plugin
        run: node experiments/hermes-desktop-adapter/desktop/build.mjs --check
      - run: node docs/diagrams/render-mermaid.mjs --check
      - run: npm run lint
      - run: npm run typecheck
      - name: Check TypeScript tools and legacy CLI entry points
        run: npm run test:tools
      - name: Run the full regression suite
        env:
          NODE_OPTIONS: --disable-warning=ExperimentalWarning
        run: |
          node --test --test-timeout=120000 test/*.test.js
  hermes-adapter-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - run: python -m pip install -r experiments/hermes-desktop-adapter/tests/requirements.txt
      - name: Test isolated Hermes plugin transport
        run: python -m pytest experiments/hermes-desktop-adapter/tests/test_backend.py -q
