name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node docs/diagrams/render-mermaid.mjs --check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: python3 -m unittest discover -s hermes_bridge -p 'test_*.py'
      - run: python3 -B -m unittest scripts.test_inventory_token_input
      - run: python3 -m pip install ruff==0.15.11
      - run: python3 -m ruff check hermes_bridge
      - run: python3 -m ruff format --check hermes_bridge
      - run: python3 -m ruff check scripts/inventory_token_input.py scripts/test_inventory_token_input.py
      - run: python3 -m ruff format --check scripts/inventory_token_input.py scripts/test_inventory_token_input.py
